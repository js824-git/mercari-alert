name: mercari-watch

on:
  schedule:
    # 5분마다 (정각을 피해 2,7,12...분에 실행 — 정각은 GitHub가 붐벼서 지연이 잦음)
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "테스트 알림 보내기 (최신 1건)"
        type: boolean
        default: false

permissions:
  contents: write   # seen.json 을 저장소에 다시 커밋하기 위해 필요

concurrency:
  group: mercari-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORD: ${{ secrets.KEYWORD }}
          TEST_MODE: ${{ inputs.test_mode && '1' || '0' }}
        run: python mercari_watch.py

      - name: Save seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "update seen items"
            git push
          fi
